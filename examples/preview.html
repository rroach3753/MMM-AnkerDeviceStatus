<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anker Power - sample preview</title>
  <link rel="stylesheet" href="../MMM-AnkerDeviceStatus.css">
  <style>
    body { background: #000; color: #ccc; font-family: Arial, sans-serif; margin: 40px; }
    .bright { color: #fff; }
    .dimmed { color: #999; }
    .small { font-size: 16px; line-height: 1.5; }
    .xsmall { font-size: 12px; line-height: 1.5; }
    .sample-label { margin-bottom: 20px; font-size: 13px; color: #999; }
  </style>
</head>
<body>
  <div class="sample-label">Sample data only - not connected to an Anker account</div>
  <main id="preview"></main>
  <script>
    const Module = {
      register(name, definition) {
        definition.config = { ...definition.defaults, showUpdated: false };
        definition.state = {
          devices: [
            {
              id: "demo-station", name: "Office Backup", model: "A1761", type: "pps",
              site: "", online: true, status: "unknown", battery: 82, input: 140,
              output: 68, solar: null, temperature: null, telemetry: "MQTT"
            },
            {
              id: "demo-solarbank", name: "Solarbank", model: "A17C1", type: "solarbank",
              site: "Home Solar", online: true, status: "charging", battery: 18,
              input: 320, output: 200, solar: 320, temperature: null, telemetry: "MQTT"
            },
            {
              id: "demo-charger", name: "Desk Charger", model: "A2345", type: "charger",
              site: "", online: true, status: "unknown", battery: null, input: null,
              output: null, solar: null, temperature: null, telemetry: "MQTT",
              chargerDetails: [
                { key: "usbc_1_power", label: "USB-C 1 Power", group: "power", value: 45.5, unit: " W" },
                { key: "usbc_1_voltage", label: "USB-C 1 Voltage", group: "voltage", value: 20, unit: " V" },
                { key: "usbc_1_current", label: "USB-C 1 Current", group: "current", value: 2.275, unit: " A" },
                { key: "usage_mode", label: "Charging mode", group: "mode", value: "AI Power", unit: "" },
                { key: "sw_version", label: "Software version", group: "software", value: "1.0.0 (sample)", unit: "" }
              ]
            }
          ],
          error: null
        };
        document.getElementById("preview").appendChild(definition.getDom());
      }
    };
  </script>
  <script src="../MMM-AnkerDeviceStatus.js"></script>
</body>
</html>
